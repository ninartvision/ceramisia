<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>გადახდა ვერ განხორციელდა — Ceramisia</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #faf9f7;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e2da;
      border-radius: 4px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fdecea;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg { color: #c0392b; }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 1.9rem;
      letter-spacing: 0.01em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.9rem;
      color: #6b6560;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2c2c2c;
      color: #fff;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn:hover { background: #444; }

    .btn--outline {
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #ccc;
    }

    .btn--outline:hover { background: #f5f3f0; }

    .lang-switch {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #aaa;
    }

    .lang-switch button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      color: #aaa;
      padding: 0 0.25rem;
      text-decoration: underline;
    }

    .lang-switch button:hover { color: #2c2c2c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>

    <h1 id="title">გადახდა ვერ განხორციელდა</h1>
    <p id="desc">გადახდა გაუქმდა ან შეცდომა მოხდა.<br>კალათა შენახულია — შეგიძლიათ თავიდან სცადოთ.</p>

    <div class="actions">
      <button class="btn" id="btn-retry" onclick="history.back()">თავიდან სცადე</button>
      <a href="/" class="btn btn--outline" id="btn-shop">მაღაზიაში დაბრუნება</a>
    </div>

    <div class="lang-switch">
      <button onclick="setLang('ge')">ქართული</button> /
      <button onclick="setLang('en')">English</button>
    </div>
  </div>

  <script>
    // Cart is intentionally NOT cleared — user can retry
    var LABELS = {
      ge: {
        title:    'გადახდა ვერ განხორციელდა',
        desc:     'გადახდა გაუქმდა ან შეცდომა მოხდა.<br>კალათა შენახულია — შეგიძლიათ თავიდან სცადოთ.',
        retry:    'თავიდან სცადე',
        shop:     'მაღაზიაში დაბრუნება',
      },
      en: {
        title:    'Payment Failed',
        desc:     'Your payment was cancelled or an error occurred.<br>Your cart is saved — you can try again.',
        retry:    'Try Again',
        shop:     'Back to Shop',
      }
    };

    function setLang(lang) {
      var l = LABELS[lang] || LABELS.ge;
      document.getElementById('title').textContent        = l.title;
      document.getElementById('desc').innerHTML           = l.desc;
      document.getElementById('btn-retry').textContent    = l.retry;
      document.getElementById('btn-shop').textContent     = l.shop;
      document.documentElement.lang = lang === 'ge' ? 'ka' : 'en';
      try { localStorage.setItem('ceramisia_lang', lang); } catch(e) {}
    }

    function clearPaymentSessionKeys() {
      [
        'ceramisia_flitt_order_id',
        'ceramisia_flitt_checkout',
        'ceramisia_flitt_checkout_at',
        'ceramisia_bog_checkout',
        'ceramisia_bog_checkout_at'
      ].forEach(function (k) {
        try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ }
        try { localStorage.removeItem(k); } catch (e) { /* ignore */ }
      });
    }

    (function () {
      clearPaymentSessionKeys();
      var lang = 'ge';
      try { lang = localStorage.getItem('ceramisia_lang') || 'ge'; } catch(e) {}
      setLang(lang);
    })();
  </script>

</body>
</html>
