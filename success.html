<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>გადახდა წარმატებულია — Ceramisia</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #faf9f7;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e2da;
      border-radius: 4px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e8f4ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg { color: #2e7d52; }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 1.9rem;
      letter-spacing: 0.01em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.9rem;
      color: #6b6560;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2c2c2c;
      color: #fff;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .btn:hover { background: #444; }

    .lang-switch {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #aaa;
    }

    .lang-switch button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      color: #aaa;
      padding: 0 0.25rem;
      text-decoration: underline;
    }

    .lang-switch button:hover { color: #2c2c2c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 id="title">გადახდა წარმატებულია</h1>
    <p id="desc">თქვენი შეკვეთა მიღებულია.<br>მალე დაგიკავშირდებით.</p>
    <a href="/" class="btn" id="btn">მაღაზიაში დაბრუნება</a>

    <div class="lang-switch">
      <button onclick="setLang('ge')">ქართული</button> /
      <button onclick="setLang('en')">English</button>
    </div>
  </div>

  <script>
    var FLITT_ORDER_ID_RE = /^flt_[0-9a-f-]{36}$/i;

    function getFlittOrderId() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('order_id') || params.get('orderId') || '';
      if (FLITT_ORDER_ID_RE.test(id)) return id;
      var fromQuery = null;
      params.forEach(function (v) {
        if (!fromQuery && FLITT_ORDER_ID_RE.test(v)) fromQuery = v;
      });
      if (fromQuery) return fromQuery;
      try {
        id = sessionStorage.getItem('ceramisia_flitt_order_id') || '';
        if (FLITT_ORDER_ID_RE.test(id)) return id;
      } catch (e) { /* ignore */ }
      try {
        id = localStorage.getItem('ceramisia_flitt_order_id') || '';
        if (FLITT_ORDER_ID_RE.test(id)) return id;
      } catch (e) { /* ignore */ }
      return null;
    }

    function clearCart() {
      localStorage.removeItem('ceramisia_cart_items');
      localStorage.setItem('ceramisia_cart', '0');
    }

    function clearFlittSession() {
      try {
        sessionStorage.removeItem('ceramisia_flitt_order_id');
        sessionStorage.removeItem('ceramisia_flitt_checkout');
      } catch (e) { /* ignore */ }
      try {
        localStorage.removeItem('ceramisia_flitt_order_id');
        localStorage.removeItem('ceramisia_flitt_checkout');
      } catch (e) { /* ignore */ }
    }

    function hasFlittCheckoutFlag() {
      try {
        if (sessionStorage.getItem('ceramisia_flitt_checkout') === '1') return true;
      } catch (e) { /* ignore */ }
      try {
        if (localStorage.getItem('ceramisia_flitt_checkout') === '1') return true;
      } catch (e) { /* ignore */ }
      return false;
    }

    function isFlittReturnVisit() {
      if (getFlittOrderId()) return true;
      return hasFlittCheckoutFlag();
    }

    function verifyFlittPayment(orderId) {
      var url = '/api/flitt-payment-status?order_id=' + encodeURIComponent(orderId);
      var attempts = 8;
      var delayMs = 1500;

      function poll(left) {
        return fetch(url)
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.paid) return true;
            if (left <= 1) return false;
            return new Promise(function (resolve) {
              setTimeout(resolve, delayMs);
            }).then(function () { return poll(left - 1); });
          });
      }

      return poll(attempts);
    }

    // Bilingual labels
    var LABELS = {
      ge: {
        title: 'გადახდა წარმატებულია',
        desc:  'თქვენი შეკვეთა მიღებულია.<br>მალე დაგიკავშირდებით.',
        btn:   'მაღაზიაში დაბრუნება',
      },
      en: {
        title: 'Payment Successful',
        desc:  'Your order has been received.<br>We will be in touch shortly.',
        btn:   'Back to Shop',
      }
    };

    function setLang(lang) {
      var l = LABELS[lang] || LABELS.ge;
      document.getElementById('title').textContent = l.title;
      document.getElementById('desc').innerHTML   = l.desc;
      document.getElementById('btn').textContent  = l.btn;
      document.documentElement.lang = lang === 'ge' ? 'ka' : 'en';
      try { localStorage.setItem('ceramisia_lang', lang); } catch(e) {}
    }

    // Apply saved language after payment verification (Flitt) or immediately (other flows)
    (function () {
      var lang = 'ge';
      try { lang = localStorage.getItem('ceramisia_lang') || 'ge'; } catch(e) {}
      var card = document.querySelector('.card');

      if (!isFlittReturnVisit()) {
        clearCart();
        setLang(lang);
        return;
      }

      if (card) card.hidden = true;

      var orderId = getFlittOrderId();
      if (!orderId) {
        clearFlittSession();
        window.location.replace('/fail.html');
        return;
      }

      verifyFlittPayment(orderId).then(function (paid) {
        if (!paid) {
          clearFlittSession();
          window.location.replace('/fail.html');
          return;
        }
        clearFlittSession();
        clearCart();
        setLang(lang);
        if (card) card.hidden = false;
      }).catch(function () {
        clearFlittSession();
        window.location.replace('/fail.html');
      });
    })();
  </script>

</body>
</html>
