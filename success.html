<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>გადახდის შემოწმება... — Ceramisia</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #faf9f7;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e2da;
      border-radius: 4px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      display: none;
    }

    .card.is-visible {
      display: block;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e8f4ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg { color: #2e7d52; }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 1.9rem;
      letter-spacing: 0.01em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.9rem;
      color: #6b6560;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2c2c2c;
      color: #fff;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .btn:hover { background: #444; }

    .lang-switch {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #aaa;
    }

    .lang-switch button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      color: #aaa;
      padding: 0 0.25rem;
      text-decoration: underline;
    }

    .lang-switch button:hover { color: #2c2c2c; }
  </style>
</head>
<body>

  <div class="card" id="payment-card" hidden>
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 id="title">გადახდა წარმატებულია</h1>
    <p id="desc">თქვენი შეკვეთა მიღებულია.<br>მალე დაგიკავშირდებით.</p>
    <a href="/" class="btn" id="btn">მაღაზიაში დაბრუნება</a>

    <div class="lang-switch">
      <button onclick="setLang('ge')">ქართული</button> /
      <button onclick="setLang('en')">English</button>
    </div>
  </div>

  <script>
    var FLITT_ORDER_ID_RE = /^flt_[0-9a-f-]{36}$/i;
    var CHECKOUT_MAX_AGE_MS = 45 * 60 * 1000;

    function readStorageItem(key) {
      var v = '';
      try {
        v = sessionStorage.getItem(key) || '';
      } catch (e) { /* ignore */ }
      if (v) return v;
      try {
        v = localStorage.getItem(key) || '';
      } catch (e) { /* ignore */ }
      return v;
    }

    function removeStorageItem(key) {
      try {
        sessionStorage.removeItem(key);
      } catch (e) { /* ignore */ }
      try {
        localStorage.removeItem(key);
      } catch (e) { /* ignore */ }
    }

    function getFlittOrderIdFromQuery() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('order_id') || params.get('orderId') || '';
      if (FLITT_ORDER_ID_RE.test(id)) return id;
      var fromQuery = null;
      params.forEach(function (v) {
        if (!fromQuery && FLITT_ORDER_ID_RE.test(v)) fromQuery = v;
      });
      return fromQuery;
    }

    function getFlittOrderIdFromStorage() {
      var id = readStorageItem('ceramisia_flitt_order_id');
      return FLITT_ORDER_ID_RE.test(id) ? id : null;
    }

    function getFlittOrderId() {
      return getFlittOrderIdFromQuery() || getFlittOrderIdFromStorage();
    }

    function getCheckoutAgeMs(atKey) {
      var raw = readStorageItem(atKey);
      var ts = Number(raw);
      if (!Number.isFinite(ts) || ts <= 0) return Infinity;
      return Date.now() - ts;
    }

    function isCheckoutFresh(flagKey, atKey) {
      if (readStorageItem(flagKey) !== '1') return false;
      return getCheckoutAgeMs(atKey) <= CHECKOUT_MAX_AGE_MS;
    }

    function clearFlittSession() {
      removeStorageItem('ceramisia_flitt_order_id');
      removeStorageItem('ceramisia_flitt_checkout');
      removeStorageItem('ceramisia_flitt_checkout_at');
    }

    function clearBogSession() {
      removeStorageItem('ceramisia_bog_checkout');
      removeStorageItem('ceramisia_bog_checkout_at');
    }

    function purgeStaleFlittSession() {
      if (readStorageItem('ceramisia_flitt_checkout') === '1' &&
          !isCheckoutFresh('ceramisia_flitt_checkout', 'ceramisia_flitt_checkout_at')) {
        clearFlittSession();
      }
    }

    function purgeStaleBogSession() {
      if (readStorageItem('ceramisia_bog_checkout') === '1' &&
          !isCheckoutFresh('ceramisia_bog_checkout', 'ceramisia_bog_checkout_at')) {
        clearBogSession();
      }
    }

    function isFlittReturnVisit() {
      if (getFlittOrderIdFromQuery()) return true;
      return (
        isCheckoutFresh('ceramisia_flitt_checkout', 'ceramisia_flitt_checkout_at') &&
        !!getFlittOrderIdFromStorage()
      );
    }

    function isBogReturnVisit() {
      return isCheckoutFresh('ceramisia_bog_checkout', 'ceramisia_bog_checkout_at');
    }

    function verifyFlittPayment(orderId) {
      var url = '/api/flitt-payment-status?order_id=' + encodeURIComponent(orderId);
      var attempts = 12;
      var delayMs = 2000;

      function poll(left) {
        return fetch(url, { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.paid) return true;
            if (left <= 1) return false;
            return new Promise(function (resolve) {
              setTimeout(resolve, delayMs);
            }).then(function () { return poll(left - 1); });
          });
      }

      return poll(attempts);
    }

    var LABELS = {
      ge: {
        title: 'გადახდა წარმატებულია',
        desc:  'თქვენი შეკვეთა მიღებულია.<br>მალე დაგიკავშირდებით.',
        btn:   'მაღაზიაში დაბრუნება',
      },
      en: {
        title: 'Payment Successful',
        desc:  'Your order has been received.<br>We will be in touch shortly.',
        btn:   'Back to Shop',
      }
    };

    var TITLE_LABELS = {
      ge: { verifying: 'გადახდის შემოწმება...', success: 'გადახდა წარმატებულია' },
      en: { verifying: 'Verifying payment...', success: 'Payment Successful' },
    };

    function setPageTitle(lang, mode) {
      var t = TITLE_LABELS[lang] || TITLE_LABELS.ge;
      document.title = (mode === 'success' ? t.success : t.verifying) + ' — Ceramisia';
    }

    function showCard(card) {
      if (!card) return;
      card.hidden = false;
      card.classList.add('is-visible');
    }

    function setLang(lang, titleMode) {
      var l = LABELS[lang] || LABELS.ge;
      document.getElementById('title').textContent = l.title;
      document.getElementById('desc').innerHTML   = l.desc;
      document.getElementById('btn').textContent  = l.btn;
      document.documentElement.lang = lang === 'ge' ? 'ka' : 'en';
      setPageTitle(lang, titleMode || 'success');
      try { localStorage.setItem('ceramisia_lang', lang); } catch (e) {}
    }

    function clearCart() {
      localStorage.removeItem('ceramisia_cart_items');
      localStorage.setItem('ceramisia_cart', '0');
    }

    (function () {
      var lang = 'ge';
      try { lang = localStorage.getItem('ceramisia_lang') || 'ge'; } catch (e) {}
      var card = document.getElementById('payment-card');

      purgeStaleFlittSession();
      purgeStaleBogSession();

      if (isFlittReturnVisit()) {
        setPageTitle(lang, 'verifying');

        var orderId = getFlittOrderId();
        if (!orderId) {
          clearFlittSession();
          window.location.replace('/fail.html');
          return;
        }

        var queryId = getFlittOrderIdFromQuery();
        var storageId = getFlittOrderIdFromStorage();
        if (
          queryId &&
          storageId &&
          queryId !== storageId &&
          isCheckoutFresh('ceramisia_flitt_checkout', 'ceramisia_flitt_checkout_at')
        ) {
          clearFlittSession();
          window.location.replace('/fail.html');
          return;
        }

        verifyFlittPayment(orderId).then(function (paid) {
          if (!paid) {
            clearFlittSession();
            window.location.replace('/fail.html');
            return;
          }
          clearFlittSession();
          clearCart();
          setLang(lang, 'success');
          showCard(card);
        }).catch(function () {
          clearFlittSession();
          window.location.replace('/fail.html');
        });
        return;
      }

      if (isBogReturnVisit()) {
        clearBogSession();
        clearCart();
        setLang(lang, 'success');
        showCard(card);
        return;
      }

      clearFlittSession();
      clearBogSession();
      window.location.replace('/fail.html');
    })();
  </script>

</body>
</html>
